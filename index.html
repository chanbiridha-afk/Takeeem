if(S.pass<50)o.push('نسبة النجاح دون 50%: خطة دعم علاجي أسبوعية، وتبسيط الدروس مع تكثيف التطبيقات.');else if(S.pass>=80)o.push('نتائج القسم جيدة؛ ارفع مستوى التحدي بأسئلة استدلالية ومقالية.');
if(S.bor>=3)o.push(`${S.bor} تلاميذ بين 8 و10: ركّز عليهم بتمارين مركّزة فهم الأقرب لتجاوز المعدل.`);
if(S.low>=3)o.push(`${S.low} تلاميذ دون 8: متابعة فردية واستدعاء الأولياء وربط كل منهم بزميل داعم.`);
if(S.sd>4)o.push('تشتت كبير بين التلاميذ: اعتمد العمل بالأفواج المتباينة وأنشطة تمايزية.');
if(ca!=null&&ex!=null&&ca-ex>=2)o.push('التقويم المستمر يفوق الاختبار بفارق ملحوظ: درّبهم على منهجية الإجابة (الاستشهاد، بناء الفقرة، تسيير الوقت) وراجع معايير التنقيط.');
if(ca!=null&&ex!=null&&ex-ca>=2)o.push('الاختبار أعلى من التقويم المستمر: حفّز المشاركة والانتظام وتفعيل دفتر التقويم.');
if(hw!=null&&hw<9)o.push('ضعف في الفروض: صحّحها جماعيا مع نموذج إجابة ثم أعد التقويم بنشاط علاجي.');
return o.length?o:['لا ملاحظات حرجة؛ واصل المتابعة.']};
const diag=(c,s)=>{const v=[1,2,3].map(t=>calc(t,c,s)),l=[...v].reverse().find(x=>x.avg!=null),o=[],q=[];
const at=attS(c,s);if(at.n>=3){if(at.a>=3||at.rate<85){o.push(`غياب غير مبرَّر ${at.a} من ${at.n} حصة (نسبة الحضور ${f(at.rate)}%).`);q.push('استدعاء الولي وتوثيق الغياب مع متابعة أسبابه.')}if(at.l>=3){o.push(`تأخر متكرر (${at.l} مرات).`);q.push('التنبيه على الالتزام بالتوقيت.')}}
if(!l)return{o:o.length?o:['لم تكتمل نقاط التلميذ بعد.'],q};
if(l.ca!=null&&l.ex!=null){const d=l.ca-l.ex;if(d>=4){o.push('فارق كبير بين التقويم المستمر والاختبار (نشاط جيد واختبار ضعيف).');q.push('تدريب على اختبارات نموذجية وتسيير الوقت والمراجعة القبلية.')}else if(-d>=4){o.push('أداؤه في الاختبار أعلى من نشاطه الصفي.');q.push('تشجيعه على المشاركة وإنجاز الواجبات.')}}
if(l.hw!=null&&l.hw<8){o.push('ضعف في الفروض.');q.push('إعادة الفرض مع تصحيح فردي.')}
const a=nu(l.r.a);if(a!=null&&a<10){o.push('ضعف الانضباط والمواظبة.');q.push('التواصل مع الولي ومتابعة الحضور.')}
const av=v.map(x=>x.avg).filter(x=>x!=null);
if(av.length>1){const d=av[av.length-1]-av[av.length-2];if(d>=2)o.push('تحسّن ملحوظ عن الفصل السابق (+'+f(d)+').');else if(d<=-2){o.push('تراجع ملحوظ عن الفصل السابق ('+f(d)+').');q.push('حوار مع التلميذ لمعرفة أسباب التراجع.')}}
if(l.avg>=14)q.push('إسناد مهام تأطير الأقران وبحوث إثرائية.');
if(l.avg>=8&&l.avg<10)q.push('على عتبة المعدل: تمارين مركّزة وهدف فصلي واضح.');
if(l.avg<8)q.push('برنامج دعم فردي بأهداف أسبوعية قصيرة.');
return{o:o.length?o:['وضعية مستقرة دون ملاحظات خاصة.'],q}};

/* التحليل */

let h=`<div class=card><h2>1) معدلات المادة — كل الأقسام (الفصل ${T})</h2>${tb(['القسم','التلاميذ','المنقَّطون','المعدل','النجاح %','متوسط ت.م','متوسط الفروض','متوسط الاختبار'],C.map(k=>{const q=rows(T,k.id),s=st(q.map(x=>x.avg));return tr([k.label,k.st.length,s?s.n:0,f(s&&s.m),f(s&&s.pass),f(me(q.map(x=>x.ca))),f(me(q.map(x=>x.hw))),f(me(q.map(x=>x.ex)))])}))}</div>`;

const L3=C.filter(k=>k.lvl==3);
h+=`<div class=card><h2>3) تحليل الاختبارات — أقسام السنة الثالثة (الفصل ${T})</h2>${tb(['القسم','المختبَرون','متوسط الاختبار','النجاح %','الوسيط','التشتت','الاختبار − ت.م','فارق ≥4 سلبا'],L3.map(k=>{const q=rows(T,k.id),s=st(q.map(x=>x.ex)),d=me(q.filter(x=>x.ex!=null&&x.ca!=null).map(x=>x.ex-x.ca));return tr([k.label,s?s.n:0,f(s&&s.m),f(s&&s.pass),f(s&&s.med),f(s&&s.sd),f(d),q.filter(x=>x.ex!=null&&x.ca!=null&&x.ca-x.ex>=4).length])}))}${c.lvl==3?'<p>توزيع الاختبار في '+c.label+':</p>'+dist(R.map(x=>x.ex)):''}</div>`;
const A=rows(T,'3331001'),B=rows(T,'3331002'),sa=st(A.map(x=>x.avg)),sb=st(B.map(x=>x.avg));
const cmp=(n,g)=>{const a=g(A),b=g(B);return tr([n,f(a),f(b),a!=null&&b!=null?f(a-b):'—'])};
h+=`<div class=card><h2>4) مقارنة ثالثة آداب وفلسفة 1 و2 (الفصل ${T})</h2>${tb(['المؤشر','آداب 1','آداب 2','الفارق'],[cmp('المعدل',x=>sa&&me(x.map(y=>y.avg))),cmp('نسبة النجاح %',x=>sa&&sb&&st(x.map(y=>y.avg)).pass),cmp('الوسيط',x=>st(x.map(y=>y.avg))&&st(x.map(y=>y.avg)).med),cmp('التشتت',x=>st(x.map(y=>y.avg))&&st(x.map(y=>y.avg)).sd),cmp('متوسط ت.م',x=>me(x.map(y=>y.ca))),cmp('متوسط الفروض',x=>me(x.map(y=>y.hw))),cmp('متوسط الاختبار',x=>me(x.map(y=>y.ex)))])}<p>${sa&&sb?(Math.abs(sa.m-sb.m)<0.5?'القسمان متقاربان في المعدل.':'الأفضل معدلا: '+(sa.m>sb.m?'آداب وفلسفة 1':'آداب وفلسفة 2')+' بفارق '+f(Math.abs(sa.m-sb.m))+' نقطة.'):'أدخل نقاط القسمين للمقارنة.'}</p></div>`;
const TS=[1,2,3].map(t=>{const q=rows(t,CI);return{q,s:st(q.map(x=>x.avg))}});
h+=`<div class=card><h2>5) مقارنة الفصول — ${c.label}</h2>${tb(['الفصل','المنقَّطون','المعدل','النجاح %','ت.م','الفروض','الاختبار','التغيّر'],TS.map((x,i)=>tr([i+1,x.s?x.s.n:0,f(x.s&&x.s.m),f(x.s&&x.s.pass),f(me(x.q.map(y=>y.ca))),f(me(x.q.map(y=>y.hw))),f(me(x.q.map(y=>y.ex))),i&&x.s&&TS[i-1].s?f(x.s.m-TS[i-1].s.m):'—'])).concat([tr(['السنوي','',f(me(c.st.map(s=>{const a=ann(CI,s[0]);return a&&a.m}))),'','','','',''])]))}</div>`;
h+=`<div class=card><h2>6) توصيات واقتراحات</h2><ul>${recs(R,S).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;return h}

function vSt(){const c=cl(CI);let h=`<div class=card><h2>وضعيات تلاميذ ${c.label}</h2>${tb(['التلميذ','الفصل 1','الفصل 2','الفصل 3','السنوي','الوضعية','غياب/عذر/تأخر','أبرز ملاحظة'],c.st.map(([id,n,p])=>{const v=[1,2,3].map(t=>calc(t,CI,id).avg),a=ann(CI,id),d=diag(CI,id),at=attS(CI,id);return`<tr class=cl onclick="SI='${id}';r()"><td class=nm>${n} ${p}</td>${v.map(x=>`<td>${f(x)}</td>`).join('')}<td><b>${a?f(a.m):'—'}</b></td><td>${tag(a&&a.m)}</td><td>${at.a}/${at.j}/${at.l}</td><td style="text-align:right">${d.o[0]}</td></tr>`}))}</div>`;
if(SI){const s=c.st.find(x=>x[0]==SI);if(s){const d=diag(CI,SI),a=ann(CI,SI),at=attS(CI,SI);h+=`<div class=card id=sc><h2>${s[1]} ${s[2]} — ${c.label}</h2>${tb(['الفصل','ت.م','الفروض','الاختبار','المعدل','التقدير','الترتيب'],[1,2,3].map(t=>{const x=calc(t,CI,SI),rk=x.avg==null?'—':1+rows(t,CI).filter(y=>y.avg!=null&&y.avg>x.avg).length+'/'+rows(t,CI).filter(y=>y.avg!=null).length;return tr([t,f(x.ca),f(x.hw),f(x.ex),'<b>'+f(x.avg)+'</b>',tag(x.avg),rk])}))}<p>المعدل السنوي (${a?a.n+' فصول':'—'}): <b>${a?f(a.m):'—'}</b> ${tag(a&&a.m)}</p><p>الحضور (${at.n} حصة مسجّلة): غياب ${at.a} · بعذر ${at.j} · تأخر ${at.l} · نسبة الحضور ${f(at.rate)}%</p><h3>التشخيص</h3><ul>${d.o.map(x=>`<li>${x}</li>`).join('')}</ul><h3>إجراءات مقترحة</h3><ul>${d.q.map(x=>`<li>${x}</li>`).join('')||'<li>مواصلة المتابعة.</li>'}</ul><textarea id=nt rows=3 style="width:100%" placeholder="ملاحظاتي على التلميذ"></textarea></div>`}}return h}

/* الحضور */
const KEYS={'3ti':['3334001'],'2hm':['3226101','3226201'],'2l':['3222201'],'3l':['3332201'],'af1':['3331001'],'af2':['3331002']};
const KL={'3ti':'ثالثة تسيير واقتصاد','2hm':'ثانية تقني رياضي (مدنية + كهربائية)','2l':'ثانية لغات','3l':'ثالثة لغات','af1':'ثالثة آداب وفلسفة 1','af2':'ثالثة آداب وفلسفة 2'};
const TT={0:[['10:00','11:00','3ti'],['11:00','12:00','2hm'],['13:30','14:30','2l'],['15:30','16:30','3l']],1:[['13:30','14:30','af1'],['14:30','15:30','3l'],['15:30','16:30','af2']],2:[['10:00','11:00','2l'],['11:00','12:00','2hm'],['13:30','14:30','3ti'],['14:30','15:30','af2'],['15:30','16:30','af1']]};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let AD=ymd(new Date()),AS=null,RK='af1',RM='';
const CY=['','a','j','l'],LB={'':'حاضر',a:'غائب',j:'غائب بعذر',l:'متأخر'},CC={'':'t1',a:'t4',j:'t3',l:'t5'};
const KOF=c=>Object.keys(KEYS).find(k=>KEYS[k].includes(String(c)));
const sess=d=>{const w=new Date(d+'T00:00').getDay(),b=(TT[w]||[]).map(([a,e,k])=>({id:d+'|'+a+'|'+k,a,e,k}));const x=Object.keys(D.at||{}).filter(i=>i.startsWith(d+'|')&&!b.some(s=>s.id==i)).map(i=>{const p=i.split('|');return{id:i,a:p[1],e:'',k:p[2]}});return b.concat(x).sort((p,q)=>p.a<q.a?-1:p.a>q.a?1:0)};
const att=(k,sid,m)=>{const ids=Object.keys(D.at||{}).filter(i=>i.split('|')[2]==k&&i.startsWith(m)),o={n:ids.length,a:0,j:0,l:0};ids.forEach(i=>{const v=D.at[i][sid];if(v==='a'||v==='j'||v==='l')o[v]++});o.rate=o.n?(o.n-o.a-o.j)/o.n*100:null;return o};
const attS=(c,s)=>att(KOF(c),s,'');
function smry(){const A=(D.at||{})[AS]||{},c={a:0,j:0,l:0};Object.values(A).forEach(v=>{if(c[v]!=null)c[v]++});const e=$('#sm');if(e)e.textContent=`غائبون: ${c.a} · بعذر: ${c.j} · متأخرون: ${c.l}`}
function cyc(b,s){D.at=D.at||{};const A=D.at[AS]=D.at[AS]||{_:1},n=CY[(CY.indexOf(A[s]||'')+1)%4];if(n)A[s]=n;else delete A[s];save();b.textContent=LB[n];b.className='t s '+CC[n];smry()}
const rec=()=>{D.at=D.at||{};D.at[AS]=D.at[AS]||{_:1};save();r()};
const delS=()=>{if(confirm('حذف تسجيل هذه الحصة؟')){delete D.at[AS];AS=null;save();r()}};

const aCsv=()=>dl(`حضور-${KL[RK]}.csv`,'\ufeff'+['اللقب,الاسم,الحصص,غياب,بعذر,تأخر,نسبة الحضور'].concat(KEYS[RK].flatMap(id=>cl(id).st.map(s=>{const o=att(RK,s[0],RM);return[s[1],s[2],o.n,o.a,o.j,o.l,f(o.rate)].join(',')}))).join('\n'));

if(cur){const L=KEYS[cur.k].flatMap(id=>cl(id).st.map(s=>({id:s[0],n:s[1]+' '+s[2]}))),A=(D.at||{})[cur.id]||{};
h+=`<div class=card><h2>${KL[cur.k]} — ${cur.a} (${AD})</h2><div class=bar><button class=b onclick="rec()">تسجيل الحصة: الجميع حاضرون عدا المُعلَّمين</button><button class="b w" onclick="delS()">حذف التسجيل</button></div><p>اضغط على حالة التلميذ لتغييرها: حاضر ← غائب ← غائب بعذر ← متأخر.</p><p id=sm></p><div class=tw><table>${L.map((s,i)=>`<tr><td>${i+1}</td><td class=nm>${s.n}</td><td><button class="t s ${CC[A[s.id]||'']}" onclick="cyc(this,'${s.id}')">${LB[A[s.id]||'']}</button></td></tr>`).join('')}</table></div></div>`}
const o=KEYS[RK].flatMap(id=>cl(id).st.map(s=>[s,att(RK,s[0],RM)]));
h+=`<div class=card><h2>تقرير الحضور</h2><div class=bar><select onchange="RK=this.value;r()">${Object.keys(KL).map(k=>`<option value=${k} ${k==RK?'selected':''}>${KL[k]}</option>`).join('')}</select><input type=month value="${RM}" onchange="RM=this.value;r()"><button class=b onclick="aCsv()">CSV</button></div>${tb(['التلميذ','الحصص المسجّلة','غياب','بعذر','تأخر','نسبة الحضور %'],o.map(([s,x])=>tr([`<span class="${x.a>=3||(x.rate!=null&&x.rate<80)?'low':''}">${s[1]} ${s[2]}</span>`,x.n,x.a,x.j,x.l,f(x.rate)])))}<p>نسبة الحضور = (الحصص − الغياب − الغياب بعذر) ÷ الحصص؛ والتأخر يُحسب حضورا. يُظهَر الاسم بالأحمر عند 3 غيابات غير مبرَّرة أو نسبة أقل من 80%.</p></div>`;
